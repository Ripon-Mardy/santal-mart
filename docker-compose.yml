services:
  postgres:
    image: postgres:17-alpine
    container_name: santal-mart-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: bazarx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - bazarx_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bazarx"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder

    container_name: santal-mart-migrate

    command: ["npx", "prisma", "migrate", "deploy"]

    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/bazarx"

    depends_on:
      postgres:
        condition: service_healthy

  bazarx:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: santal-mart

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ${DOCKER_AUTH_SECRET}

      DATABASE_URL: ${DOCKER_DATABASE_URL}

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  bazarx_postgres_data:
